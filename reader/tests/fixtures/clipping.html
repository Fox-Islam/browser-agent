<!doctype html>
<html><head><title>Clipping</title><style>.clipper { overflow: hidden; height: 30px; margin: 8px; }</style></head>
<body>
<div class="clipper"><div style="position:absolute;top:100px;left:10px"><button>Escaping menu item</button></div></div>
<div class="clipper" style="position:relative"><div style="position:absolute;top:100px;left:200px"><button>Clipped by containing block</button></div></div>
<div class="clipper"><button style="position:fixed;top:300px;left:10px">Escaping fixed</button></div>
<div class="clipper" style="transform:translateZ(0)"><button style="position:fixed;top:300px;left:200px">Clipped fixed</button></div>
<div class="clipper"><div style="position:relative"><button style="position:absolute;top:160px;left:400px">Clipped through a positioned wrapper</button></div></div>
</body></html>
