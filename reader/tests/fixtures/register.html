<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Register</title></head>
<body>
<h1>Create your account</h1>
<label>Email <input id="email" type="email"></label>
<label>Password <input id="password" type="password"></label>
<button id="show" onclick="document.getElementById('password').type = 'text'">Show password</button>
<button id="create" onclick="document.getElementById('done').textContent = 'Account created'">Create my account</button>
<p id="done"></p>
</body>
</html>
