<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Profile</title></head>
<body>
<h1>Profile</h1>
<label>Name <input id="name"></label> <button id="save">Save</button>
<p id="status"></p>
<div><button style="width:40px;height:40px;background:#d62828"></button><button style="width:40px;height:40px;background:#1e6fd9"></button></div>
<script>
document.getElementById('save').onclick = () => {
    fetch('save-api.php', { method: 'POST', body: document.getElementById('name').value });
    document.getElementById('status').textContent = 'Saved';
};
</script>
</body>
</html>
