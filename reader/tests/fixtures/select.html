<!doctype html>
<html><head><title>Select</title></head>
<body>
<label for="size">Size</label>
<select id="size">
  <option value="s">Small</option>
  <option value="m" selected>Medium</option>
  <option value="l" disabled>Large</option>
  <optgroup label="Special" disabled><option value="xl">Extra large</option></optgroup>
  <option value="xs" label="Extra small">ignored text</option>
</select>
<select aria-label="Toppings" multiple>
  <option value="a" selected>Anchovies</option>
  <option value="b" selected>Basil</option>
  <option value="c">Cheese</option>
</select>
</body></html>
