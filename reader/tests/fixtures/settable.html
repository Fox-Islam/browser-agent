<!doctype html>
<html><head><title>Settable</title><style>input { display: block; margin: 6px; }</style></head>
<body>
<input type="date" aria-label="Date" value="2026-09-24" min="2026-01-01" max="2026-12-31">
<input type="time" aria-label="Time" value="09:30">
<input type="time" aria-label="Precise time" step="1">
<input type="datetime-local" aria-label="Appointment">
<input type="month" aria-label="Month">
<input type="week" aria-label="Week">
<input type="color" aria-label="Colour" value="#ff0000">
<input type="range" aria-label="Volume" value="30" min="0" max="50" step="5">
<input type="date" aria-label="Fixed date" readonly>
<input type="number" aria-label="Guests" min="1" max="8">
<input type="text" aria-label="Name" min="1">
</body></html>
